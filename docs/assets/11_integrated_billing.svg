  </g>
  <g font-size="12" fill="#334155">
    <text x="268" y="456">住居費総計: <tspan fill="#0369a1" font-weight="bold">¥372,740</tspan></text>
    <text x="470" y="456">介護総計: <tspan fill="#b45309" font-weight="bold">¥100,100</tspan></text>
    <text x="650" y="456">総合計: <tspan fill="#b91c1c" font-weight="bold">¥472,840</tspan></text>
  </g>
  <g font-size="10" fill="#64748b">
    <text x="268" y="482">家賃計 ¥250,000　管理費計 ¥120,000　自費計 ¥2,740</text>
  </g>

  <!-- 凡例 -->
  <rect x="248" y="540" width="812" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="268" y="562" font-size="11" fill="#475569" font-weight="bold">列の見方：</text>
  <text x="360" y="562" font-size="10" fill="#64748b">住居費計＝家賃＋管理費＋自費（月次請求）、介護計＝介護サービス請求の合計、総合計＝住居費計＋介護計</text>
  <text x="268" y="584" font-size="10" fill="#94a3b8">※ 介護サービス種別（訪問介護・通所介護等）ごとの列は動的に生成されます。下書きの介護サービス請求は集計対象外です。</text>
</svg>
