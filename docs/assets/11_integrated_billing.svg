  <rect x="416" y="96" width="140" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="428" y="118" font-size="11" fill="#475569">施設: 全施設 ▼</text>
  <rect x="920" y="96" width="140" height="34" rx="6" fill="#0ea5e9"/>
