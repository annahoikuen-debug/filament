  <text x="258" y="382" font-size="11" fill="#94a3b8">…（対象月の在籍入居者全件表示）</text>

  <!-- 集計サマリー -->
  <rect x="248" y="400" width="812" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-size="11" fill="#475569" font-weight="bold">
