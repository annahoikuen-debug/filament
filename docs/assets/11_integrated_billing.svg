  <rect x="248" y="146" width="812" height="38" rx="8" fill="#f8fafc"/>
  <g font-size="10" fill="#64748b" font-weight="bold">
    <text x="258" y="170">部屋番号</text>
    <text x="330" y="170">入居者名</text>
    <text x="405" y="170">家賃</text>
    <text x="465" y="170">管理費</text>
    <text x="525" y="170">自費</text>
    <text x="585" y="170">訪問介護</text>
    <text x="655" y="170">通所介護</text>
    <text x="730" y="170">住居費計</text>
    <text x="805" y="170">介護計</text>
    <text x="875" y="170">総合計(税込)</text>
  </g>
  <line x1="248" y1="184" x2="1060" y2="184" stroke="#e2e8f0"/>

  <!-- 行1 -->
  <g font-size="11" fill="#334155">
    <rect x="253" y="196" width="46" height="20" rx="10" fill="#dbeafe"/>
    <text x="276" y="210" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">101</text>
    <text x="330" y="210" font-weight="bold">佐藤 一郎</text>
    <text x="405" y="210">¥65,000</text>
    <text x="465" y="210">¥30,000</text>
    <text x="525" y="210">¥540</text>
    <text x="585" y="210">¥52,800</text>
    <text x="655" y="210">¥0</text>
    <text x="730" y="210" fill="#0369a1" font-weight="bold">¥95,540</text>
    <text x="805" y="210" fill="#b45309" font-weight="bold">¥52,800</text>
    <text x="875" y="210" fill="#b91c1c" font-weight="bold">¥148,340</text>
  </g>
  <line x1="248" y1="230" x2="1060" y2="230" stroke="#f1f5f9"/>

  <!-- 行2 -->
  <g font-size="11" fill="#334155">
    <rect x="253" y="244" width="46" height="20" rx="10" fill="#dbeafe"/>
    <text x="276" y="258" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">102</text>
    <text x="330" y="258" font-weight="bold">鈴木 ハナ</text>
    <text x="405" y="258">¥60,000</text>
    <text x="465" y="258">¥30,000</text>
    <text x="525" y="258">¥0</text>
    <text x="585" y="258">¥0</text>
    <text x="655" y="258">¥34,100</text>
    <text x="730" y="258" fill="#0369a1" font-weight="bold">¥90,000</text>
    <text x="805" y="258" fill="#b45309" font-weight="bold">¥34,100</text>
    <text x="875" y="258" fill="#b91c1c" font-weight="bold">¥124,100</text>
  </g>
  <line x1="248" y1="278" x2="1060" y2="278" stroke="#f1f5f9"/>

  <!-- 行3 -->
  <g font-size="11" fill="#334155">
    <rect x="253" y="292" width="46" height="20" rx="10" fill="#dbeafe"/>
    <text x="276" y="306" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">103</text>
    <text x="330" y="306" font-weight="bold">高橋 健二</text>
    <text x="405" y="306">¥65,000</text>
    <text x="465" y="306">¥30,000</text>
    <text x="525" y="306">¥2,200</text>
    <text x="585" y="306">¥0</text>
    <text x="655" y="306">¥0</text>
    <text x="730" y="306" fill="#0369a1" font-weight="bold">¥97,200</text>
    <text x="805" y="306" fill="#b45309" font-weight="bold">¥0</text>
    <text x="875" y="306" fill="#b91c1c" font-weight="bold">¥97,200</text>
  </g>
  <line x1="248" y1="326" x2="1060" y2="326" stroke="#f1f5f9"/>

  <!-- 行4 -->
  <g font-size="11" fill="#334155">
    <rect x="253" y="340" width="46" height="20" rx="10" fill="#dbeafe"/>
    <text x="276" y="354" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="bold">104</text>
