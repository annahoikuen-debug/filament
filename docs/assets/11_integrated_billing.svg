    <text x="405" y="354">¥60,000</text>
    <text x="465" y="354">¥30,000</text>
    <text x="525" y="354">¥0</text>
    <text x="585" y="354">¥13,200</text>
    <text x="655" y="354">¥0</text>
    <text x="730" y="354" fill="#0369a1" font-weight="bold">¥90,000</text>
    <text x="805" y="354" fill="#b45309" font-weight="bold">¥13,200</text>
    <text x="875" y="354" fill="#b91c1c" font-weight="bold">¥103,200</text>
