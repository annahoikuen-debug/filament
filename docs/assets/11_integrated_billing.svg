  <text x="20" y="260" font-size="13" fill="#475569">監査ログ</text>

  <text x="248" y="80" font-size="20" fill="#0f172a" font-weight="bold">統合請求管理ダッシュボード</text>

  <!-- フィルタ -->
  <rect x="248" y="96" width="160" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
