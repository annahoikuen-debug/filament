<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="'Segoe UI','Hiragino Kaku Gothic ProN','Meiryo',sans-serif">
  <rect width="1100" height="680" fill="#f8fafc"/>
  <rect x="0" y="0" width="1100" height="48" fill="#0f172a"/>
  <text x="20" y="30" font-size="15" fill="#ffffff" font-weight="bold">請求管理システム</text>
  <rect x="0" y="48" width="220" height="632" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="20" y="119" font-size="13" fill="#475569">入居者マスタ</text>
  <text x="20" y="152" font-size="13" fill="#475569">自費品目マスタ</text>
  <text x="20" y="186" font-size="13" fill="#475569">日々の自費記録</text>
  <rect x="0" y="204" width="220" height="36" fill="#f0f9ff"/>
  <rect x="0" y="204" width="4" height="36" fill="#0284c7"/>
  <text x="20" y="227" font-size="13" fill="#0369a1" font-weight="bold">月次請求データ</text>
  <text x="20" y="260" font-size="13" fill="#475569">施設</text>

  <text x="248" y="80" font-size="20" fill="#0f172a" font-weight="bold">月次請求一覧</text>

  <!-- ヘッダーアクション -->
  <rect x="248" y="96" width="210" height="34" rx="6" fill="#0284c7"/>
  <text x="353" y="118" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">🧮 〇月の請求データを一括生成する</text>
  <rect x="466" y="96" width="150" height="34" rx="6" fill="#0284c7"/>
  <text x="541" y="118" font-size="11" fill="#fff" text-anchor="middle">📦 一括PDF(ZIP)出力</text>
  <rect x="624" y="96" width="130" height="34" rx="6" fill="#64748b"/>
  <text x="689" y="118" font-size="11" fill="#fff" text-anchor="middle">📊 会計CSV出力</text>
  <rect x="762" y="96" width="110" height="34" rx="6" fill="#fff" stroke="#0284c7"/>
  <text x="817" y="118" font-size="11" fill="#0284c7" text-anchor="middle">＋ 手動作成</text>

  <!-- フィルタ -->
  <rect x="248" y="144" width="160" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="260" y="165" font-size="11" fill="#475569">請求年月: 2026年10月分 ▼</text>
  <rect x="416" y="144" width="140" height="32" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="428" y="165" font-size="11" fill="#475569">ステータス: すべて ▼</text>

  <!-- テーブル -->
  <rect x="248" y="190" width="812" height="400" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="248" y="190" width="812" height="38" rx="8" fill="#f8fafc"/>
  <g font-size="10" fill="#64748b" font-weight="bold">
    <text x="258" y="214">請求年月</text>
    <text x="340" y="214">部屋番号</text>
    <text x="420" y="214">入居者氏名</text>
    <text x="540" y="214">家賃</text>
    <text x="610" y="214">管理費</text>
    <text x="680" y="214">自費小計</text>
    <text x="750" y="214">合計請求額</text>
    <text x="840" y="214">ステータス</text>
    <text x="920" y="214">入金日</text>
    <text x="980" y="214">操作</text>
  </g>
  <line x1="248" y1="228" x2="1060" y2="228" stroke="#e2e8f0"/>

  <!-- 行1: 未請求 -->
  <g font-size="11" fill="#334155">
    <text x="258" y="252">2026-10</text>
    <rect x="340" y="240" width="46" height="20" rx="10" fill="#dbeafe"/>
    <text x="363" y="254" font-size="10" fill="#1d4ed8" text-anchor="middle">101</text>
    <text x="420" y="254">佐藤 一郎</text>
    <text x="540" y="254">¥65,000</text>
    <text x="610" y="254">¥30,000</text>
    <text x="680" y="254">¥540</text>
    <text x="750" y="254" font-weight="bold">¥95,540</text>
    <rect x="840" y="240" width="52" height="20" rx="10" fill="#fef3c7"/>
    <text x="866" y="254" font-size="10" fill="#b45309" text-anchor="middle">未請求</text>
    <text x="920" y="254" fill="#94a3b8">-</text>
    <text x="975" y="254" font-size="10" fill="#0284c7">請求書PDF</text>
    <text x="975" y="268" font-size="10" fill="#16a34a">入金消込</text>
  </g>
  <line x1="248" y1="276" x2="1060" y2="276" stroke="#f1f5f9"/>

  <!-- 行2: 請求済 -->
  <g font-size="11" fill="#334155">
    <text x="258" y="300">2026-10</text>
    <rect x="340" y="288" width="46" height="20" rx="10" fill="#dbeafe"/>
    <text x="363" y="302" font-size="10" fill="#1d4ed8" text-anchor="middle">102</text>
    <text x="420" y="302">鈴木 ハナ</text>
    <text x="540" y="302">¥60,000</text>
    <text x="610" y="302">¥30,000</text>
    <text x="680" y="302">¥0</text>
    <text x="750" y="302" font-weight="bold">¥90,000</text>
    <rect x="840" y="288" width="52" height="20" rx="10" fill="#e0f2fe"/>
    <text x="866" y="302" font-size="10" fill="#0369a1" text-anchor="middle">請求済</text>
    <text x="920" y="302" fill="#94a3b8">-</text>
    <text x="975" y="302" font-size="10" fill="#0284c7">請求書PDF</text>
  </g>
  <line x1="248" y1="324" x2="1060" y2="324" stroke="#f1f5f9"/>

  <!-- 行3: 入金済 -->
  <g font-size="11" fill="#334155">
    <text x="258" y="348">2026-09</text>
    <rect x="340" y="336" width="46" height="20" rx="10" fill="#dbeafe"/>
    <text x="363" y="350" font-size="10" fill="#1d4ed8" text-anchor="middle">103</text>
    <text x="420" y="350">高橋 健二</text>
    <text x="540" y="350">¥65,000</text>
    <text x="610" y="350">¥30,000</text>
    <text x="680" y="350">¥2,200</text>
    <text x="750" y="350" font-weight="bold">¥97,200</text>
    <rect x="840" y="336" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="866" y="350" font-size="10" fill="#15803d" text-anchor="middle">入金済</text>
    <text x="920" y="350">09/25</text>
    <text x="975" y="350" font-size="10" fill="#d97706">領収書PDF</text>
  </g>
  <line x1="248" y1="372" x2="1060" y2="372" stroke="#f1f5f9"/>

  <!-- 行4: 入金済（口座振替） -->
  <g font-size="11" fill="#334155">
    <text x="258" y="396">2026-09</text>
    <rect x="340" y="384" width="46" height="20" rx="10" fill="#dbeafe"/>
    <text x="363" y="398" font-size="10" fill="#1d4ed8" text-anchor="middle">104</text>
    <text x="420" y="398">田中 トメ</text>
    <text x="540" y="398">¥60,000</text>
    <text x="610" y="398">¥30,000</text>
    <text x="680" y="398">¥0</text>
    <text x="750" y="398" font-weight="bold">¥90,000</text>
    <rect x="840" y="384" width="52" height="20" rx="10" fill="#dcfce7"/>
    <text x="866" y="398" font-size="10" fill="#15803d" text-anchor="middle">入金済</text>
    <text x="920" y="398">09/27</text>
    <text x="975" y="398" font-size="10" fill="#d97706">領収書PDF</text>
  </g>
  <text x="258" y="424" font-size="11" fill="#94a3b8">…（対象月の全件表示）</text>

  <!-- 合計サマリー -->
  <rect x="700" y="440" width="360" height="34" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="716" y="462" font-size="12" fill="#0369a1" font-weight="bold">請求総計: ¥372,740</text>

  <!-- 凡例 -->
  <rect x="248" y="606" width="812" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="268" y="628" font-size="11" fill="#475569" font-weight="bold">ステータス色：</text>
  <rect x="360" y="618" width="52" height="18" rx="9" fill="#fef3c7"/>
  <text x="386" y="631" font-size="10" fill="#b45309" text-anchor="middle">未請求</text>
  <rect x="424" y="618" width="52" height="18" rx="9" fill="#e0f2fe"/>
  <text x="450" y="631" font-size="10" fill="#0369a1" text-anchor="middle">請求済</text>
  <rect x="488" y="618" width="52" height="18" rx="9" fill="#dcfce7"/>
  <text x="514" y="631" font-size="10" fill="#15803d" text-anchor="middle">入金済</text>
  <text x="268" y="650" font-size="10" fill="#94a3b8">※ 請求済・入金済のデータは編集・削除できません（確定保護）。領収書PDFは入金済のみ表示されます。</text>
</svg>
