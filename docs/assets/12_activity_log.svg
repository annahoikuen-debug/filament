<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'Segoe UI','Hiragino Kaku Gothic ProN','Meiryo',sans-serif">
  <rect width="1100" height="620" fill="#f8fafc"/>
  <rect x="0" y="0" width="1100" height="48" fill="#0f172a"/>
  <text x="20" y="30" font-size="15" fill="#ffffff" font-weight="bold">請求管理システム</text>
  <rect x="0" y="48" width="220" height="572" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="20" y="119" font-size="13" fill="#475569">日々の自費記録</text>
  <text x="20" y="152" font-size="13" fill="#475569">月次請求データ</text>
  <text x="20" y="185" font-size="13" fill="#475569">介護サービス請求</text>
  <text x="20" y="218" font-size="13" fill="#475569">統合請求管理</text>
  <rect x="0" y="236" width="220" height="36" fill="#f0f9ff"/>
  <rect x="0" y="236" width="4" height="36" fill="#0284c7"/>
  <text x="20" y="259" font-size="13" fill="#0369a1" font-weight="bold">監査ログ</text>

  <text x="248" y="80" font-size="20" fill="#0f172a" font-weight="bold">監査ログ一覧</text>
  <text x="850" y="80" font-size="11" fill="#94a3b8">🔒 法人管理者のみ閲覧可能</text>

  <!-- フィルタ -->
  <rect x="248" y="96" width="150" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="260" y="118" font-size="11" fill="#475569">ログ名: すべて ▼</text>
  <rect x="406" y="96" width="150" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="418" y="118" font-size="11" fill="#475569">イベント: すべて ▼</text>
  <rect x="564" y="96" width="190" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="576" y="118" font-size="11" fill="#475569">期間: 2026-10-01 〜 10-31 ▼</text>

  <!-- テーブル -->
  <rect x="248" y="146" width="812" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="248" y="146" width="812" height="38" rx="8" fill="#f8fafc"/>
  <g font-size="10" fill="#64748b" font-weight="bold">
    <text x="258" y="170">日時</text>
    <text x="380" y="170">ログ名</text>
    <text x="490" y="170">説明</text>
    <text x="650" y="170">対象モデル</text>
    <text x="740" y="170">対象ID</text>
    <text x="810" y="170">実行者</text>
    <text x="890" y="170">イベント</text>
    <text x="985" y="170">操作</text>
  </g>
  <line x1="248" y1="184" x2="1060" y2="184" stroke="#e2e8f0"/>

  <!-- 行1: 作成 -->
  <g font-size="11" fill="#334155">
    <text x="258" y="208">10/01 02:00:15</text>
    <rect x="375" y="196" width="80" height="20" rx="10" fill="#dbeafe"/>
    <text x="415" y="210" font-size="10" fill="#1d4ed8" text-anchor="middle">月次請求</text>
    <text x="490" y="210">月次請求生成コマンド実行: 2026-09</text>
    <text x="650" y="210">MonthlyInvoice</text>
    <text x="740" y="210">125</text>
    <text x="810" y="210">system</text>
    <rect x="888" y="196" width="60" height="20" rx="10" fill="#dcfce7"/>
    <text x="918" y="210" font-size="10" fill="#15803d" text-anchor="middle">created</text>
    <text x="985" y="210" font-size="10" fill="#0284c7">表示 👁</text>
  </g>
  <line x1="248" y1="230" x2="1060" y2="230" stroke="#f1f5f9"/>

  <!-- 行2: 更新 -->
  <g font-size="11" fill="#334155">
    <text x="258" y="254">10/05 10:23:41</text>
    <rect x="375" y="242" width="80" height="20" rx="10" fill="#dbeafe"/>
    <text x="415" y="256" font-size="10" fill="#1d4ed8" text-anchor="middle">入居者</text>
    <text x="490" y="256">佐藤 一郎 の基本家賃を更新</text>
    <text x="650" y="256">Resident</text>
    <text x="740" y="256">1</text>
    <text x="810" y="256">admin</text>
    <rect x="888" y="242" width="60" height="20" rx="10" fill="#fef3c7"/>
    <text x="918" y="256" font-size="10" fill="#b45309" text-anchor="middle">updated</text>
    <text x="985" y="256" font-size="10" fill="#0284c7">表示 👁</text>
  </g>
  <line x1="248" y1="278" x2="1060" y2="278" stroke="#f1f5f9"/>

  <!-- 行3: ステータス変更 -->
  <g font-size="11" fill="#334155">
    <text x="258" y="302">10/12 14:05:09</text>
    <rect x="375" y="290" width="80" height="20" rx="10" fill="#dbeafe"/>
    <text x="415" y="304" font-size="10" fill="#1d4ed8" text-anchor="middle">月次請求</text>
    <text x="490" y="304">請求ステータス: unbilled → billed</text>
    <text x="650" y="304">MonthlyInvoice</text>
    <text x="740" y="304">101</text>
    <text x="810" y="304">admin</text>
    <rect x="888" y="290" width="60" height="20" rx="10" fill="#e0f2fe"/>
    <text x="918" y="304" font-size="9" fill="#0369a1" text-anchor="middle">status</text>
    <text x="985" y="304" font-size="10" fill="#0284c7">表示 👁</text>
  </g>
  <line x1="248" y1="326" x2="1060" y2="326" stroke="#f1f5f9"/>

  <!-- 行4: 作成 -->
  <g font-size="11" fill="#334155">
    <text x="258" y="350">10/15 09:47:33</text>
    <rect x="375" y="338" width="80" height="20" rx="10" fill="#dbeafe"/>
    <text x="415" y="352" font-size="10" fill="#1d4ed8" text-anchor="middle">日々の自費</text>
    <text x="490" y="352">紙おむつ(パンツタイプ) を登録</text>
    <text x="650" y="352">DailyCharge</text>
    <text x="740" y="352">3,204</text>
    <text x="810" y="352">staff01</text>
    <rect x="888" y="338" width="60" height="20" rx="10" fill="#dcfce7"/>
    <text x="918" y="352" font-size="10" fill="#15803d" text-anchor="middle">created</text>
    <text x="985" y="352" font-size="10" fill="#0284c7">表示 👁</text>
  </g>
  <text x="258" y="380" font-size="11" fill="#94a3b8">…（全ログ表示・自動記録）</text>

  <!-- 詳詳細プレビュー -->
  <rect x="248" y="400" width="812" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="268" y="428" font-size="11" fill="#475569" font-weight="bold">詳細ビュー（表示 👁 クリック時）：</text>
  <g font-size="10" fill="#64748b">
    <text x="268" y="452">ログ名: 月次請求　|　イベント: created　|　対象: MonthlyInvoice #125　|　実行者: system</text>
    <text x="268" y="472">変更内容（KeyValue）: year_month=2026-09　created=125　updated=0　skipped=3　errors=0</text>
  </g>

  <!-- 凡例 -->
  <rect x="248" y="540" width="812" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="268" y="562" font-size="11" fill="#475569" font-weight="bold">イベント色：</text>
  <rect x="360" y="552" width="60" height="18" rx="9" fill="#dcfce7"/>
  <text x="390" y="565" font-size="10" fill="#15803d" text-anchor="middle">created</text>
  <rect x="432" y="552" width="60" height="18" rx="9" fill="#fef3c7"/>
  <text x="462" y="565" font-size="10" fill="#b45309" text-anchor="middle">updated</text>
  <rect x="504" y="552" width="60" height="18" rx="9" fill="#fee2e2"/>
  <text x="534" y="565" font-size="10" fill="#b91c1c" text-anchor="middle">deleted</text>
  <rect x="576" y="552" width="70" height="18" rx="9" fill="#e0f2fe"/>
  <text x="611" y="565" font-size="9" fill="#0369a1" text-anchor="middle">status_changed</text>
  <text x="268" y="584" font-size="10" fill="#94a3b8">※ 主要モデル（入居者・請求品目・日々の自費・月次請求・施設・税率・ユーザー等）の変更を自動記録。施設管理者は自施設のログのみ表示。</text>
</svg>
