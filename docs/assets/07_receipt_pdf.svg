<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" font-family="'Hiragino Mincho ProN','Yu Mincho','MS Gothic',serif">
  <rect width="760" height="1000" fill="#ffffff"/>
  <rect x="0" y="0" width="760" height="1000" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="380" y="80" font-size="34" fill="#111827" text-anchor="middle" font-weight="bold" letter-spacing="10">領　収　証</text>
  <line x1="60" y1="100" x2="700" y2="100" stroke="#111827" stroke-width="2"/>

  <!-- 宛先 -->
  <text x="60" y="150" font-size="14" fill="#374151">居室: <tspan font-weight="bold">103 号室</tspan></text>
  <text x="60" y="182" font-size="22" fill="#111827" font-weight="bold" text-decoration="underline">高橋 健二 様</text>
  <text x="60" y="206" font-size="11" fill="#6b7280">(タカハシ ケンジ)</text>

  <!-- 発行者 -->
  <g font-size="10" fill="#374151" text-anchor="end">
    <text x="700" y="140">領収番号: REC-202609-0003</text>
    <text x="700" y="158">領収日: 2026年09月25日</text>
    <text x="700" y="186" font-size="13" font-weight="bold" fill="#111827">ケアレジデンス ひまわり</text>
    <text x="700" y="202">株式会社ひまわりケア</text>
    <text x="700" y="218">〒123-4567 東京都〇〇区〇〇町 1-2-3</text>
    <text x="700" y="234">TEL: 03-1234-5678</text>
    <text x="700" y="254" font-weight="bold" fill="#1e40af">登録番号: T1234567890123</text>
  </g>

  <!-- 領収金額 -->
  <rect x="60" y="290" width="640" height="70" rx="4" fill="#f9fafb" stroke="#1f2937" stroke-width="2"/>
  <text x="380" y="336" font-size="15" fill="#111827" text-anchor="middle" font-weight="bold">領収金額 (税込)：</text>
  <text x="380" y="336" font-size="28" fill="#111827" text-anchor="middle" font-weight="bold" dx="150">¥97,200 -</text>

  <!-- 但し書き -->
  <text x="380" y="396" font-size="12" fill="#374151" text-anchor="middle">但し、2026年9月度 施設利用料金（家賃・管理費・自費実費）として、</text>
  <text x="380" y="416" font-size="12" fill="#374151" text-anchor="middle">上記金額を正に領収いたしました。</text>
  <text x="380" y="440" font-size="10" fill="#4b5563" text-anchor="middle">(入金区分: 銀行振込)</text>
  <line x1="60" y1="456" x2="700" y2="456" stroke="#9ca3af" stroke-dasharray="2,3"/>

  <!-- 内訳明細 -->
  <text x="60" y="486" font-size="13" fill="#111827" font-weight="bold">【内訳明細】</text>
  <g font-size="11">
    <rect x="60" y="500" width="640" height="30" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="70" y="520" font-weight="bold">内訳科目</text>
    <text x="280" y="520" font-weight="bold">金額</text>
    <text x="420" y="520" font-weight="bold">税区分</text>
    <text x="520" y="520" font-weight="bold">税率</text>
    <text x="640" y="520" font-weight="bold">消費税額</text>
    <line x1="60" y1="530" x2="700" y2="530" stroke="#d1d5db"/>

    <text x="70" y="556">基本家賃</text>
    <text x="280" y="556" text-anchor="end">¥65,000</text>
    <text x="420" y="556" text-anchor="middle">非課税</text>
    <text x="520" y="556" text-anchor="middle">-</text>
    <text x="640" y="556" text-anchor="end">¥0</text>
    <line x1="60" y1="568" x2="700" y2="568" stroke="#e5e7eb"/>

    <text x="70" y="592">基本管理費</text>
    <text x="280" y="592" text-anchor="end">¥30,000</text>
    <text x="420" y="592" text-anchor="middle">課税</text>
    <text x="520" y="592" text-anchor="middle">10%</text>
    <text x="640" y="592" text-anchor="end">¥3,000</text>
    <line x1="60" y1="604" x2="700" y2="604" stroke="#e5e7eb"/>

    <text x="70" y="628">自費サービス・立替金</text>
    <text x="280" y="628" text-anchor="end">¥2,200</text>
    <text x="420" y="628" text-anchor="middle">課税・非課税実費</text>
    <text x="520" y="628" text-anchor="middle">10%</text>
    <text x="640" y="628" text-anchor="end">¥220</text>
    <line x1="60" y1="640" x2="700" y2="640" stroke="#d1d5db"/>

    <rect x="60" y="642" width="640" height="30" fill="#f9fafb"/>
    <text x="70" y="662" font-weight="bold">合計（税抜）</text>
    <text x="280" y="662" text-anchor="end" font-weight="bold">¥97,200</text>
    <text x="640" y="662" text-anchor="end" font-weight="bold">¥3,220</text>

    <rect x="60" y="672" width="640" height="34" fill="#ef4444"/>
    <text x="70" y="694" fill="#ffffff" font-weight="bold">合計（税込）</text>
    <text x="280" y="694" fill="#ffffff" text-anchor="end" font-weight="bold">¥100,420</text>
  </g>

  <!-- 印枠 -->
  <rect x="560" y="740" width="80" height="80" rx="4" fill="none" stroke="#ef4444" stroke-dasharray="4,3"/>
  <text x="600" y="786" font-size="10" fill="#ef4444" text-anchor="middle">領収印</text>

  <text x="60" y="860" font-size="10" fill="#6b7280">※電子的に作成された領収証です。税務申告等の証明書類としてご利用いただけます。</text>

  <text x="380" y="960" font-size="10" fill="#94a3b8" text-anchor="middle">— 領収書PDFの様式（A4縦・入金済データのみ発行可能）—</text>
</svg>
