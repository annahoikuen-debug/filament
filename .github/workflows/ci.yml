name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  php-tests:
    name: PHPUnit / Pest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, gd, zip, dom
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  code-style:
    name: Laravel Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint (scoped)
        run: vendor/bin/pint --test app tests routes config database

  website-checks:
    name: Website (links / structure / encoding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links, structure, and encoding
        run: pwsh -File scripts/check-links.ps1

      - name: Detect mojibake
        run: pwsh -File scripts/detect-mojibake.ps1
